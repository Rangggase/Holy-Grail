[theme]
base = "light"
primaryColor = "#0F5C4D"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
borderColor = "#E2E8F0"
baseRadius = "0.5rem"
showWidgetBorder = true
dataframeHeaderBackgroundColor = "#F1F5F9"

[client]
toolbarMode = "minimal"
showErrorDetails = false

[server]
enableXsrfProtection = true
enableCORS = true
headless = true

[browser]
gatherUsageStats = false
